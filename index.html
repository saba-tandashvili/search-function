<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    
    <header>
        <button class="list">
            <i class="fa-solid fa-list" style="color: #ffffff;"></i>
        </button>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input class="input" type="text" placeholder="Search..." aria-label="Search menu items">
        </div>

        <button class="cart">
            <i class="fa-solid fa-cart-shopping"></i>
        </button>
    </header>

    <div class="banner">
        <h1>Quick Bite</h1>
        <p>Where Taste Takes The Fast Lane</p>
    </div>

    <div class="section-title">
        <h2>FOOD MENU</h2>
    </div>

    <div class="carousel">
        <div class="item">
            <img src="images/salad.png" alt="">
            <p class="name">Salad</p>
        </div>

        <div class="item">
            <img src="images/burger.png" alt="">
            <p class="name">Burger</p>
        </div>

        <div class="item">
            <img src="images/milkshake.png" alt="">
            <p class="name">Milkshake</p>
        </div>

        <div class="item">
            <img src="images/french-fries.png" alt="">
            <p class="name">French Fries</p>
        </div>

        <div class="item">
            <img src="images/nuggets.png" alt="">
            <p class="name">Nuggets</p>
        </div>

        <div class="item">
            <img src="images/pizza-slice.png" alt="">
            <p class="name">Pizza Slice</p>
        </div>

        <div class="item">
            <img src="images/soft-drink.png" alt="">
            <p class="name">Soft Drink</p>
        </div>

        <div class="item">
            <img src="images/coffee.png" alt="">
            <p class="name">Coffee</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
